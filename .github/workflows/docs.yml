name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  BUILD_DIR: build
  DOCS_DIR: build/docs/html

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doxygen, Graphviz and MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz openmpi-bin libopenmpi-dev

      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DENABLE_DOCS=ON

      - name: Generate documentation
        run: |
          cmake --build ${{ env.BUILD_DIR }} --target docs

      - name: Verify documentation
        run: |
          test -d "${{ env.DOCS_DIR }}"
          test -f "${{ env.DOCS_DIR }}/index.html"

      - name: Disable Jekyll
        if: github.event_name != 'pull_request'
        run: |
          touch "${{ env.DOCS_DIR }}/.nojekyll"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.DOCS_DIR }}

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5